---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: clickhouse
  labels:
    app: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - zookeeper
                topologyKey: kubernetes.io/hostname

      containers:
        - name: zookeeper
          image: zookeeper:3.8.3
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: follower
            - containerPort: 3888
              name: election
            - containerPort: 7000
              name: metrics

          env:
            - name: ZOO_SERVERS
              value: "server.1=zookeeper-0.zookeeper-headless.clickhouse.svc.cluster.local:2888:3888;2181 server.2=zookeeper-1.zookeeper-headless.clickhouse.svc.cluster.local:2888:3888;2181 server.3=zookeeper-2.zookeeper-headless.clickhouse.svc.cluster.local:2888:3888;2181"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "srvr,mntr,conf,ruok"
            - name: ZOO_TICK_TIME
              value: "2000"
            - name: ZOO_INIT_LIMIT
              value: "10"
            - name: ZOO_SYNC_LIMIT
              value: "5"
            - name: ZOO_MAX_CLIENT_CNXNS
              value: "60"
            - name: ZOO_AUTOPURGE_PURGEINTERVAL
              value: "1"
            - name: ZOO_AUTOPURGE_SNAPRETAINCOUNT
              value: "3"

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - echo ruok | nc localhost 2181 | grep imok
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - echo ruok | nc localhost 2181 | grep imok
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: clickhouse-ssd
        resources:
          requests:
            storage: 10Gi

    - metadata:
        name: datalog
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: clickhouse-ssd
        resources:
          requests:
            storage: 10Gi
