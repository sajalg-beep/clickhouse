---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse-cluster
  namespace: clickhouse
  labels:
    app: clickhouse
    managed-by: kubectl
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
      logVolumeClaimTemplate: log-volume
      serviceTemplate: chi-service
      podTemplate: clickhouse-pod

  configuration:
    users:
      admin/password: "changeme"
      admin/networks/ip:
        - "::/0"
      admin/profile: "default"
      admin/quota: "default"

    profiles:
      default:
        max_memory_usage: 10000000000
        use_uncompressed_cache: 0
        load_balancing: "random"
        log_queries: 1
        log_query_threads: 1
        max_execution_time: 600

    quotas:
      default:
        interval:
          duration: 3600
          queries: 0
          errors: 0
          result_rows: 0
          read_rows: 0
          execution_time: 0

    zookeeper:
      nodes:
        - host: zookeeper-0.zookeeper-headless.clickhouse.svc.cluster.local
          port: 2181
        - host: zookeeper-1.zookeeper-headless.clickhouse.svc.cluster.local
          port: 2181
        - host: zookeeper-2.zookeeper-headless.clickhouse.svc.cluster.local
          port: 2181

    clusters:
      - name: clickhouse-cluster
        layout:
          shardsCount: 2
          replicasCount: 3

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          serviceAccountName: clickhouse-sa

          # Topology Spread Constraints for balanced distribution across zones and racks
          topologySpreadConstraints:
            # Spread across availability zones
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  clickhouse.altinity.com/app: chop
              matchLabelKeys:
                - clickhouse.altinity.com/chi

            # Spread across racks (custom label)
            - maxSkew: 1
              topologyKey: topology.clickhouse.com/rack
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  clickhouse.altinity.com/app: chop
              matchLabelKeys:
                - clickhouse.altinity.com/chi

            # Spread across nodes within same zone
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  clickhouse.altinity.com/app: chop
              matchLabelKeys:
                - clickhouse.altinity.com/ShardName

          affinity:
            # Pod Anti-Affinity: Prefer not to schedule replicas on the same node
            podAntiAffinity:
              # REQUIRED: Never schedule two replicas of the same shard on the same node
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: clickhouse.altinity.com/app
                        operator: In
                        values:
                          - chop
                      - key: clickhouse.altinity.com/ShardName
                        operator: Exists
                  topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}

              # PREFERRED: Spread replicas across zones
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: clickhouse.altinity.com/app
                          operator: In
                          values:
                            - chop
                    topologyKey: topology.kubernetes.io/zone
                    namespaceSelector: {}

                # PREFERRED: Spread replicas across racks
                - weight: 50
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: clickhouse.altinity.com/app
                          operator: In
                          values:
                            - chop
                    topologyKey: topology.clickhouse.com/rack
                    namespaceSelector: {}

            # Node Affinity: Prefer nodes labeled for ClickHouse workload
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: workload
                        operator: In
                        values:
                          - clickhouse
                      - key: node.kubernetes.io/instance-type
                        operator: In
                        values:
                          - n2-standard-8
                          - n2-standard-16
                          - n2-highmem-8
                          - n2-highmem-16

          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:23.8
              ports:
                - name: http
                  containerPort: 8123
                - name: tcp
                  containerPort: 9000
                - name: interserver
                  containerPort: 9009

              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                limits:
                  cpu: "2"
                  memory: "8Gi"

              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3

              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3

              volumeMounts:
                - name: data-volume
                  mountPath: /var/lib/clickhouse
                - name: log-volume
                  mountPath: /var/log/clickhouse-server
                - name: clickhouse-config
                  mountPath: /etc/clickhouse-server/config.d/custom.xml
                  subPath: custom.xml

          volumes:
            - name: clickhouse-config
              configMap:
                name: clickhouse-custom-config

    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: clickhouse-ssd

      - name: log-volume
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: clickhouse-ssd

    serviceTemplates:
      - name: chi-service
        spec:
          ports:
            - name: http
              port: 8123
              targetPort: 8123
            - name: tcp
              port: 9000
              targetPort: 9000
          type: ClusterIP
