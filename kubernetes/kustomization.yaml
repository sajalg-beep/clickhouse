apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Root kustomization for the entire ClickHouse cluster
# Deploy everything with: kubectl apply -k kubernetes/

resources:
  - base
  - zookeeper
  - clickhouse
  - backup
  - monitoring

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/instance: clickhouse-prod
